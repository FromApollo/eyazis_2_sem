{% extends "base.html" %}
{% block title %}Search — Vector System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 text-center">
    <h1 class="mb-3">Vector-Model Search</h1>
    <p class="text-muted">
      English-language document search over a local collection,
      ranked by cosine similarity.
      New here? See the <a href="{{ url_for('help_page') }}">Help page</a> for a quick guide.
    </p>

    <form action="{{ url_for('search') }}" method="get" class="mt-4">
      <div class="input-group input-group-lg mb-3">
        <input type="text" name="q" class="form-control js-search-input" placeholder="Enter search query..." autocomplete="off" autofocus>
        <button class="btn btn-primary" type="submit">Search</button>
      </div>

      <div class="row g-2 justify-content-center align-items-center">
        <div class="col-auto">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="all_words" id="all_words">
            <label class="form-check-label" for="all_words">
              Require all query words
              <span tabindex="0" data-bs-toggle="tooltip"
                    title="Only show documents that contain every word from your query (AND search), instead of ranking by how many match.">ⓘ</span>
            </label>
          </div>
        </div>
        <div class="col-auto">
          <label class="form-label mb-0 me-1">From</label>
          <input type="date" name="date_start" class="form-control form-control-sm d-inline-block" style="width:auto">
        </div>
        <div class="col-auto">
          <label class="form-label mb-0 me-1">To</label>
          <input type="date" name="date_end" class="form-control form-control-sm d-inline-block" style="width:auto">
          <span tabindex="0" data-bs-toggle="tooltip"
                title="Only show documents added within this date range. Leave blank to search all dates.">ⓘ</span>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
