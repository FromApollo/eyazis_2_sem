<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Literature Reader</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <main class="container py-5" style="max-width: 900px">
    <header class="mb-4">
      <span class="badge text-bg-primary mb-3">English text-to-speech</span>
      <h1 class="display-6 fw-semibold">Literature Reader</h1>
      <p class="text-secondary mb-0">Listen to an English literature essay with the voice, pace and volume you prefer.</p>
    </header>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <label for="text" class="form-label fw-semibold">Essay text</label>
        <textarea id="text" class="form-control" rows="9" maxlength="{{ max_length }}" placeholder="Write or paste your English essay here...">In literature, a journey often reveals more than a destination. A character's choices, doubts, and memories help us understand the world they inhabit.</textarea>
        <div class="d-flex justify-content-between form-text"><span>Paste text with Ctrl+V</span><span id="count">0 / {{ max_length }}</span></div>

        <div class="row g-3 mt-2">
          <div class="col-md-6">
            <label for="voice" class="form-label fw-semibold">Voice</label>
            <select id="voice" class="form-select" aria-label="English voice"><option>Loading voices...</option></select>
          </div>
          <div class="col-md-3">
            <label for="rate" class="form-label fw-semibold">Tempo <span id="rateValue" class="text-secondary fw-normal">1.0×</span></label>
            <input id="rate" type="range" class="form-range" min="5" max="20" value="10">
            <div class="d-flex justify-content-between form-text"><span>Slow</span><span>Fast</span></div>
          </div>
          <div class="col-md-3">
            <label for="volume" class="form-label fw-semibold">Volume <span id="volumeValue" class="text-secondary fw-normal">100%</span></label>
            <input id="volume" type="range" class="form-range" min="0" max="100" value="100">
            <div class="d-flex justify-content-between form-text"><span>0%</span><span>100%</span></div>
          </div>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2 mt-4">
          <button id="generate" class="btn btn-primary px-4" type="button">Read aloud</button>
          <button id="pause" class="btn btn-outline-secondary" type="button" disabled>Pause</button>
          <button id="stop" class="btn btn-outline-secondary" type="button" disabled>Stop</button>
        </div>
        <div id="message" class="mt-3" role="status" aria-live="polite"></div>
      </div>
    </div>
    <p class="small text-secondary mt-3">Uses the English voices available in your browser and Windows.</p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
